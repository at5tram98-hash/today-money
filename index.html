function installHorizontalSwipe(el,onNext,onPrev,threshold=56){if(!el)return;let sx=0,sy=0;el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});el.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>threshold&&Math.abs(dx)>Math.abs(dy)*1.35){dx<0?onNext?.():onPrev?.()}})}
function trackingDateBounds(){const today=ymd();return {min:addDays(today,-4),max:today}}
function shiftTrackingDate(delta){const {min,max}=trackingDateBounds(),next=addDays(trackingDate,delta);if(next<min||next>max)return;trackingDate=next;renderAll()}

function addNotice(title,message,type='info',notify=true){const key=`${title}|${message}|${ymd()}`;if(data.notices.some(n=>n.key===key))return false;data.notices.unshift({id:uid('note'),key,title,message,type,date:new Date().toISOString(),read:false});data.notices=data.notices.slice(0,80);save();if(notify&&(type==='warning'||/給料日|支払日|固定支払い/.test(title)))sendBrowserNotice('My Money 2.0',`${title}：${message}`);return true}
function unreadNotices(){return data.notices.filter(n=>!n.read).length}
function showAlert(title,message,opts={}){return new Promise(resolve=>{const w=document.getElementById('alertWrap');document.getElementById('alertTitle').textContent=title;document.getElementById('alertMessage').textContent=message;const a=document.getElementById('alertActions');a.innerHTML='';const cancel=document.createElement('button');cancel.textContent=opts.cancelText||'キャンセル';cancel.onclick=()=>{w.classList.remove('show');resolve(false)};const ok=document.createElement('button');ok.textContent=opts.okText||'OK';if(opts.destructive)ok.className='destructive';ok.onclick=()=>{w.classList.remove('show');resolve(true)};a.append(cancel,ok);w.classList.add('show')})}
function openPopover(anchor,items){const p=document.getElementById('popover'),r=anchor.getBoundingClientRect();p.innerHTML=items.map((x,i)=>`<button class="pop-item ${x.danger?'danger':''}" data-i="${i}"><span class="pop-icon">${popoverIcon(x.icon)}</span><span>${esc(x.label)}</span></button>`).join('');p.style.top=Math.min(innerHeight-20-items.length*45,r.bottom+4)+'px';p.style.right=Math.max(8,innerWidth-r.right)+'px';p.style.left='auto';p.classList.add('show');p.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const item=items[Number(b.dataset.i)];p.classList.remove('show');item?.action?.()};setTimeout(()=>document.addEventListener('click',closePop,{once:true}),0);function closePop(e){if(!p.contains(e.target))p.classList.remove('show')}}
function openSheet(html,mode='half',binder){if(sheetCleanup)try{sheetCleanup()}catch(e){}const s=document.getElementById('sheet'),d=document.getElementById('dim');s.className=`sheet ${mode}`;s.innerHTML=`<div class="grabber"></div>${html}`;d.classList.add('show');s.classList.add('show');d.onclick=closeSheet;sheetCleanup=binder?.(s)||null}

function pushView(title,html,binder,right='',backOverride=null){const id=uid('view'),v=document.createElement('section'),tabNames={today:'今日',month:'今月',pay:'給与・支払',assets:'資産',settings:'設定'},parent=pushStack[pushStack.length-1],backLabel=backOverride||parent?.title||tabNames[activeTab]||'戻る';v.className='push-view';v.id=id;v.innerHTML=`<div class="push-nav"><button class="back-btn" aria-label="${esc(backLabel)}に戻る">${icon('chevronLeft')}<span>${esc(backLabel)}</span></button><div class="push-title">${esc(title)}</div><div class="push-right">${right}</div></div><div class="push-body">${html}</div>`;document.getElementById('pushLayer').appendChild(v);pushStack.push({id,binder,title,backLabel});v.querySelector('.back-btn').onclick=popView;requestAnimationFrame(()=>v.classList.add('show'));installInteractiveBack(v,id);binder?.(v);return v}
function popView(){if(goalPlannerState?.locked)return false;const x=pushStack.pop();if(!x)return false;const v=document.getElementById(x.id);v?.classList.remove('show');if(goalPlannerState?.viewId===x.id)goalPlannerState=null;setTimeout(()=>v?.remove(),300);return true}
function replaceTopPush(title,html,binder,right=''){const x=pushStack.pop();document.getElementById(x?.id)?.remove();return pushView(title,html,binder,right,x?.backLabel||null)}
function installInteractiveBack(v,id){let sx=0,sy=0,lastX=0,lastT=0,tracking=false,horizontal=false;const start=e=>{if(goalPlannerState?.locked)return;if(pushStack[pushStack.length-1]?.id!==id||document.getElementById('sheet').classList.contains('show')||document.getElementById('calculator').classList.contains('show'))return;const t=e.touches?.[0]||e;if(t.clientX>24)return;sx=lastX=t.clientX;sy=t.clientY;lastT=performance.now();tracking=true;horizontal=false};const move=e=>{if(!tracking)return;const t=e.touches?.[0]||e,dx=Math.max(0,t.clientX-sx),dy=Math.abs(t.clientY-sy);if(!horizontal){if(dy>10&&dy>dx){tracking=false;return}if(dx>7)horizontal=true}if(!horizontal)return;e.preventDefault?.();lastX=t.clientX;lastT=performance.now();v.classList.add('interactive');v.style.transform=`translateX(${Math.min(innerWidth,dx)}px)`};const end=e=>{if(goalPlannerState?.locked){cancel();return;}if(!tracking&&!horizontal)return;const t=e.changedTouches?.[0]||e,dx=Math.max(0,(t?.clientX??lastX)-sx),elapsed=Math.max(1,performance.now()-lastT),velocity=Math.max(0,((t?.clientX??lastX)-lastX)/elapsed);tracking=false;v.classList.remove('interactive');v.style.transition='transform .28s cubic-bezier(.22,.88,.22,1)';if(dx>innerWidth*.33||velocity>.55){v.style.transform='translateX(100%)';setTimeout(()=>{if(pushStack[pushStack.length-1]?.id===id){pushStack.pop();if(goalPlannerState?.viewId===id)goalPlannerState=null;v.remove()}},285)}else{v.style.transform='translateX(0)';setTimeout(()=>{v.style.transform='';v.style.transition=''},290)}horizontal=false};v.addEventListener('touchstart',start,{passive:true});v.addEventListener('touchmove',move,{passive:false});v.addEventListener('touchend',end,{passive:true});v.addEventListener('touchcancel',end,{passive:true})}
function refreshEmployerDetail(id){const e=employerById(id),top=pushStack[pushStack.length-1];if(e&&top?.title===e.name){popView();setTimeout(()=>openEmployerDetail(id),320)}else renderAll()}

let calcValue='0',calcCb=null,calcStored=null,calcOp=null,calcWaiting=false,calcLastOperand=null;
function openCalculator(title='金額',initial=0,cb){calcValue=String(Math.round(Number(initial)||0));calcStored=null;calcOp=null;calcWaiting=false;calcLastOperand=null;calcCb=cb;document.getElementById('calcTitle').textContent=title;updateCalc();document.getElementById('dim').classList.add('show');document.getElementById('calculator').classList.add('show')}
function closeCalc(){document.getElementById('calculator').classList.remove('show');if(!document.getElementById('sheet').classList.contains('show'))document.getElementById('dim').classList.remove('show');calcCb=null;calcStored=null;calcOp=null;calcWaiting=false;calcLastOperand=null;updateCalc()}
function calcCompute(a,b,op){a=Number(a)||0;b=Number(b)||0;if(op==='+')return a+b;if(op==='-')return a-b;if(op==='*')return a*b;if(op==='/')return b===0?a:a/b;return b}
function calcFinalValue(){const v=Math.round(Number(calcValue)||0);return Math.max(0,Math.min(999999999,v))}
function updateCalc(){const n=Number(calcValue||0),text=Number.isFinite(n)?Math.round(n).toLocaleString('ja-JP'):'0';document.getElementById('calcNumber').textContent=text;document.querySelectorAll('#calcGrid .calc-key.op').forEach(b=>b.classList.toggle('active',!!calcOp&&b.dataset.k===`op:${calcOp}`))}
function calcKey(k){
  if(/^\d+$/.test(k)){if(calcWaiting){calcValue=k;calcWaiting=false}else{const neg=calcValue.startsWith('-'),raw=neg?calcValue.slice(1):calcValue;let next=raw==='0'?k:raw+k;if(next.length>9)next=next.slice(0,9);calcValue=(neg?'-':'')+next}updateCalc();return}
  if(k==='00'){if(calcWaiting){calcValue='0';calcWaiting=false}else if(calcValue!=='0'&&calcValue!=='-0'){const neg=calcValue.startsWith('-'),raw=(neg?calcValue.slice(1):calcValue);calcValue=(neg?'-':'')+(raw+'00').slice(0,9)}updateCalc();return}
  if(k==='back'){if(calcWaiting)return;const neg=calcValue.startsWith('-'),raw=neg?calcValue.slice(1):calcValue;const next=raw.length>1?raw.slice(0,-1):'0';calcValue=(neg&&next!=='0'?'-':'')+next;updateCalc();return}
  if(k==='clear'){calcValue='0';calcStored=null;calcOp=null;calcWaiting=false;calcLastOperand=null;updateCalc();return}
  if(k==='sign'){if(calcValue!=='0')calcValue=calcValue.startsWith('-')?calcValue.slice(1):'-'+calcValue;updateCalc();return}
  if(k==='percent'){calcValue=String(Math.round((Number(calcValue)||0)/100));updateCalc();return}
  if(k.startsWith('op:')){const nextOp=k.slice(3),input=Number(calcValue)||0;if(calcOp&&calcStored!=null&&!calcWaiting){calcStored=calcCompute(calcStored,input,calcOp);calcValue=String(Math.round(calcStored))}else calcStored=input;calcOp=nextOp;calcWaiting=true;calcLastOperand=null;updateCalc();return}
  if(k==='done'){if(calcOp&&calcStored!=null){const operand=calcWaiting?(calcLastOperand??(Number(calcValue)||0)):(Number(calcValue)||0);calcLastOperand=operand;calcValue=String(Math.round(calcCompute(calcStored,operand,calcOp)));calcStored=Number(calcValue)||0;calcWaiting=true;updateCalc()}return}
}
const calcKeys=[['AC','clear','util'],['±','sign','util'],['%','percent','util'],['÷','op:/','op'],['7','7',''],['8','8',''],['9','9',''],['×','op:*','op'],['4','4',''],['5','5',''],['6','6',''],['−','op:-','op'],['1','1',''],['2','2',''],['3','3',''],['＋','op:+','op'],['0','0',''],['00','00',''],['⌫','back','util'],['＝','done','op']];
document.getElementById('calcGrid').innerHTML=calcKeys.map(([l,k,c])=>`<button type="button" class="calc-key ${c}" data-k="${k}" aria-label="${l}">${l}</button>`).join('');
document.getElementById('calcGrid').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;calcKey(b.dataset.k)};
document.getElementById('calcCancel').onclick=closeCalc;document.getElementById('calcDone').onclick=()=>{const cb=calcCb,v=calcFinalValue();closeCalc();cb?.(v)};
function moneyButton(id,label,value){return `<button class="field money-field press" id="${id}"><span class="hint">${esc(label)}</span><span class="val">${yen(value)}</span></button>`}
function makeSelect(opts,value){return opts.map(o=>`<option value="${esc(o.value??o)}" ${(o.value??o)===value?'selected':''}>${esc(o.label??o)}</option>`).join('')}
function bankSnapshot(bank,memo='残高更新'){if(!bank)return;data.assetSnapshots.push({id:uid('snap'),date:ymd(),createdAt:new Date().toISOString(),bankId:bank.id,bankBalance:Number(bank.balance)||0,bankTotal:totalBankBalance(),memo});data.assetSnapshots=data.assetSnapshots.slice(-600)}
function bankEffectEventTime({date='',createdAt='',eventAt=''}={}){if(eventAt){const n=Date.parse(eventAt);if(Number.isFinite(n))return n}if(createdAt){const n=Date.parse(createdAt);if(Number.isFinite(n))return n}if(date){const n=Date.parse(`${date}T23:59:59`);if(Number.isFinite(n))return n}return Date.now()}
function bankEffectWithinBaseline(bankId,item,{respectBalanceAsOf=false,eventAt=''}={}){const b=bankById(bankId);if(!b||!respectBalanceAsOf||!b.balanceAsOf)return false;const asOfMs=Date.parse(b.balanceAsOf);if(!Number.isFinite(asOfMs))return false;const asOfDate=ymd(new Date(asOfMs)),itemDate=String(item?.date||'');if(itemDate){if(itemDate<asOfDate)return true;if(itemDate>asOfDate)return false}return bankEffectEventTime({date:itemDate,createdAt:item?.createdAt,eventAt})<=asOfMs}
function reconcileBankHistoryToAsOf(bankId,asOfIso){const asOfMs=Date.parse(asOfIso||''),asOfDate=Number.isFinite(asOfMs)?ymd(new Date(asOfMs)):'';if(!Number.isFinite(asOfMs))return;for(const t of data.transactions){if(transactionBankId(t)!==bankId)continue;const eventMs=bankEffectEventTime({date:t.date,createdAt:t.createdAt,eventAt:t.bankEffectAt});if((t.date&&t.date<asOfDate)||(t.date===asOfDate&&eventMs<=asOfMs)){t.bankApplied=false;t.bankReconciled=true;t.bankEffectAt=t.bankEffectAt||asOfIso}}for(const x of data.incomes){if(x.toType!=='bank'||x.bankId!==bankId)continue;const eventMs=bankEffectEventTime({date:x.date,createdAt:x.createdAt,eventAt:x.bankEffectAt});if((x.date&&x.date<asOfDate)||(x.date===asOfDate&&eventMs<=asOfMs)){x.bankApplied=false;x.bankReconciled=true;x.bankEffectAt=x.bankEffectAt||asOfIso}}}
function reconcileBankBalance(bankId,balance,memo='手動残高'){const b=bankById(bankId);if(!b)return false;const now=new Date().toISOString();b.balance=Math.max(0,Number(balance)||0);b.updatedAt=now;b.balanceAsOf=now;reconcileBankHistoryToAsOf(bankId,now);bankSnapshot(b,memo);return true}
function shouldApplyBankEffect(bankId,item,opts={}){const b=bankById(bankId);return !!b&&!bankEffectWithinBaseline(bankId,item,opts)}
function updateBank(bankId,delta,memo='残高更新'){const b=bankById(bankId);if(!b)return false;b.balance=(Number(b.balance)||0)+Number(delta||0);b.updatedAt=new Date().toISOString();bankSnapshot(b,memo);if(data.notificationSettings.balance&&Number(b.threshold)>0&&b.balance<b.threshold){addNotice('残高低下アラート',`${b.name}の残高が設定額を下回りました（${yen(b.balance)}）`,'warning');sendBrowserNotice('My Money 2.0',`${b.name}の残高が${yen(b.balance)}になりました。`)}return true}
function applyBankEffectForTransaction(t,{respectBalanceAsOf=true,eventAt=''}={}){const bankId=transactionBankId(t);if(!bankId){t.bankApplied=false;t.bankReconciled=false;return false}if(bankEffectWithinBaseline(bankId,t,{respectBalanceAsOf,eventAt})){t.bankApplied=false;t.bankReconciled=true;t.linkedBankId=t.linkedBankId||bankId;return false}if(!shouldApplyBankEffect(bankId,t,{respectBalanceAsOf,eventAt})){t.bankApplied=false;return false}updateBank(bankId,-Number(t.amount||0),t.merchant||'取引');t.bankApplied=true;t.bankReconciled=false;t.bankEffectAt=new Date().toISOString();t.linkedBankId=t.linkedBankId||bankId;return true}
function reverseBankEffectForTransaction(t){if(!t?.bankApplied)return false;const bankId=transactionBankId(t),b=bankById(bankId);if(!b){t.bankApplied=false;return false}if(b.balanceAsOf&&t.bankEffectAt&&Date.parse(t.bankEffectAt)<=Date.parse(b.balanceAsOf)){t.bankApplied=false;t.bankReconciled=true;return false}updateBank(bankId,Number(t.amount||0),`${t.merchant||'取引'}・取消`);t.bankApplied=false;t.bankReconciled=false;return true}
function applyBankEffectForIncome(x,{respectBalanceAsOf=true,eventAt=''}={}){if(x?.toType!=='bank'||!x.bankId){x.bankApplied=false;x.bankReconciled=false;return false}if(bankEffectWithinBaseline(x.bankId,x,{respectBalanceAsOf,eventAt})){x.bankApplied=false;x.bankReconciled=true;return false}if(!shouldApplyBankEffect(x.bankId,x,{respectBalanceAsOf,eventAt})){x.bankApplied=false;return false}updateBank(x.bankId,Number(x.amount)||0,x.sourceName||'収入');x.bankApplied=true;x.bankReconciled=false;x.bankEffectAt=new Date().toISOString();return true}
function reverseBankEffectForIncome(x){if(!x?.bankApplied||!x.bankId)return false;const b=bankById(x.bankId);if(!b){x.bankApplied=false;return false}if(b.balanceAsOf&&x.bankEffectAt&&Date.parse(x.bankEffectAt)<=Date.parse(b.balanceAsOf)){x.bankApplied=false;x.bankReconciled=true;return false}updateBank(x.bankId,-Number(x.amount||0),`${x.sourceName||'収入'}・取消`);x.bankApplied=false;x.bankReconciled=false;return true}
function recordExpense({date=trackingDate,amount=0,category='その他',merchant='支出',paymentMethod='other',paymentId='',memo='',source='manual',mailImportId='',fixedId='',linkedBankId='',respectBalanceAsOf=true,eventAt='',saveNow=true}){amount=Math.abs(Number(amount)||0);if(!amount)return null;const t={id:uid('tx'),date,amount,category,merchant,paymentMethod,paymentId,memo,source,mailImportId,fixedId,linkedBankId:linkedBankId||(paymentMethod==='debit'?paymentBankId(paymentMethod,paymentId):''),bankApplied:false,bankReconciled:false,createdAt:new Date().toISOString()};data.transactions.push(t);if(paymentMethod==='bank'||paymentMethod==='debit')applyBankEffectForTransaction(t,{respectBalanceAsOf,eventAt});if(saveNow)save();checkGoalNotice(date);return t}

function recordIncome({date=trackingDate,amount=0,sourceName='収入',toType='cash',bankId='',memo='',kind='temporary',employerId='',salaryRecordId='',tempIncomeId='',applyNow=true,respectBalanceAsOf=true,eventAt='',saveNow=true}){amount=Math.abs(Number(amount)||0);if(!amount)return null;const x={id:uid('inc'),date,amount,sourceName,toType,bankId,memo,kind,employerId,salaryRecordId,tempIncomeId,bankApplied:false,bankReconciled:false,createdAt:new Date().toISOString()};data.incomes.push(x);if(applyNow&&toType==='bank'&&bankId)applyBankEffectForIncome(x,{respectBalanceAsOf,eventAt});if(saveNow)save();return x}
function checkGoalNotice(date){const g=dailyGoal(date),s=spentDate(date),isToday=date===ymd();if(g.total){if(s===g.total){const added=addNotice('当日目標に到達しました',`${dayLabel(date)}の支出が目標金額 ${yen(g.total)} に到達しました。`,'info',false);if(added&&isToday&&data.notificationSettings.goal)sendBrowserNotice('My Money 2.0',`今日の支出が目標金額 ${yen(g.total)} に到達しました。`)}else if(s>g.total){const added=addNotice('当日目標を超過しました',`${dayLabel(date)}の支出が目標を${yen(s-g.total)}超えています。`,'warning',false);if(added&&isToday&&data.notificationSettings.goal)sendBrowserNotice('My Money 2.0',`今日の支出が目標を${yen(s-g.total)}超えました。`)}}const month=date.slice(0,7),mg=monthlyGoal(month),ms=spentMonth(month);if(mg.total){if(ms===mg.total){const added=addNotice('月間目標に到達しました',`${monthLabel(month)}の支出が月間目標 ${yen(mg.total)} に到達しました。`,'info',false);if(added&&month===ym()&&data.notificationSettings.goal)sendBrowserNotice('My Money 2.0',`今月の支出が月間目標 ${yen(mg.total)} に到達しました。`)}else if(ms>mg.total){const added=addNotice('月間目標を超過しました',`${monthLabel(month)}の支出が月間目標を${yen(ms-mg.total)}超えています。`,'warning',false);if(added&&month===ym()&&data.notificationSettings.goal)sendBrowserNotice('My Money 2.0',`今月の支出が目標を${yen(ms-mg.total)}超えました。`)}}}

function processScheduled(){const today=ymd();let changed=false;for(const sr of data.salaryRecords.filter(x=>x.date&&x.date<=today&&x.status!=='入金済')){const e=employerById(sr.employerId);if(!e)continue;let inc=data.incomes.find(x=>x.salaryRecordId===sr.id);if(!inc){inc=recordIncome({date:sr.date,amount:sr.gross,sourceName:e.name,toType:e.bankId?'bank':'cash',bankId:e.bankId,kind:'salary',employerId:e.id,salaryRecordId:sr.id,applyNow:true,respectBalanceAsOf:true,eventAt:`${sr.date}T00:00:00`,saveNow:false});changed=true}else if(inc.toType==='bank'&&!inc.bankApplied&&!inc.bankReconciled){applyBankEffectForIncome(inc,{respectBalanceAsOf:true,eventAt:`${sr.date}T00:00:00`});changed=true}sr.status='入金済';changed=true}for(const temp of data.tempIncomes.filter(t=>t.date&&t.date<=today)){const inc=linkedIncomeForTemp(temp);if(inc?.toType==='bank'&&!inc.bankApplied&&!inc.bankReconciled){applyBankEffectForIncome(inc,{respectBalanceAsOf:true,eventAt:`${temp.date}T00:00:00`});changed=true}}const earliestFixed=data.fixedPayments.map(f=>String(f.startMonth||'')).filter(x=>/^\d{4}-\d{2}$/.test(x)).sort()[0]||today.slice(0,7),startMonth=data.meta.lastScheduleDate?String(data.meta.lastScheduleDate).slice(0,7):earliestFixed,endMonth=today.slice(0,7),[sy,sm]=startMonth.split('-').map(Number),[ey,em]=endMonth.split('-').map(Number),span=Math.max(0,(ey-sy)*12+(em-sm));for(let i=0;i<=span;i++){const month=addMonths(startMonth,i);for(const f of data.fixedPayments){for(const date of fixedDueDatesInMonth(f,month)){if(date>today||(f.skippedDates||[]).includes(date))continue;if(data.transactions.some(t=>t.source==='fixed'&&t.fixedId===f.id&&t.date===date))continue;recordExpense({date,amount:f.amount,category:f.category,merchant:f.name,paymentMethod:f.paymentMethod,paymentId:f.paymentId,source:'fixed',fixedId:f.id,respectBalanceAsOf:true,eventAt:`${date}T00:00:00`,saveNow:false});changed=true}}}if(data.meta.lastScheduleDate!==today){data.meta.lastScheduleDate=today;changed=true}if(changed)save( function generateSystemNotices(){const tomorrow=addDays(ymd(),1),tomMonth=tomorrow.slice(0,7);if(data.notificationSettings.salary)for(const e of data.employers){const sourceMonth=addMonths(tomMonth,-(Number(e.payMonthOffset)||0));if(employerPayDate(e,sourceMonth)===tomorrow)addNotice('明日は給料日です',`${e.name}の給料日が明日に設定されています。`)}if(data.notificationSettings.payment){const tomD=parseYmd(tomorrow).getDate();for(const c of data.cards)if(c.dueDay!=null&&Number(c.dueDay)===tomD)addNotice('明日はカード支払日です',`${c.name}の支払日です。`);for(const f of data.fixedPayments)if(fixedDueOn(f,tomorrow))addNotice('明日は固定支払い日です',`${f.name} ${yen(f.amount)}の支払い予定です。`)}if(data.notificationSettings.unknown){const n=data.mailImports.filter(x=>x.status==='pending').length;if(n)addNotice('カテゴリー不明の取引',`${n}件の取引に確認が必要です。`,'warning')}}

function hasDailySpendData(date){return txForDate(date).length>0||data.dailyCorrections[date]!=null}
function hasMonthSpendData(month){return txForMonth(month).length>0||data.monthlyCorrections[month]!=null}
function roundGoalAmount(value,unit){return Math.max(0,Math.round((Number(value)||0)/unit)*unit)}
function sameWeekdaySpendHistory(date,weeks=3){const out=[];for(let i=1;i<=weeks;i++){const d=addDays(date,-7*i);if(hasDailySpendData(d))out.push({date:d,total:spentDate(d)})}return out}
function recommendedDaily(date){const hist=sameWeekdaySpendHistory(date,3),existing=dailyGoal(date).total,current=spentDate(date);if(hist.length)return roundGoalAmount(sum(hist,x=>x.total)/hist.length,100);return roundGoalAmount(Math.max(existing,current*1.1,1000),100)}
function recommendedMonth(month){const vals=[];for(let i=1;i<=3;i++){const m=addMonths(month,-i);if(hasMonthSpendData(m))vals.push(spentMonth(m))}const existing=monthlyGoal(month).total,current=spentMonth(month);return vals.length?roundGoalAmount(sum(vals)/vals.length,1000):roundGoalAmount(Math.max(existing,current*1.1,10000),1000)}
function goalCategoryHistory(type,key){const result={};for(const c of data.categories){const vals=[];if(type==='daily'){for(const item of sameWeekdaySpendHistory(key,3))vals.push(dailyCategorySpent(item.date,c.name))}else{for(let i=1;i<=3;i++){const m=addMonths(key,-i);if(hasMonthSpendData(m))vals.push(monthCategorySpent(m,c.name))}}result[c.name]=vals.length?sum(vals)/vals.length:0}return result}
function scaleGoalCategories(raw,total,unit){const entries=data.categories.map(c=>[c.name,Math.max(0,Number(raw[c.name])||0)]),base=sum(entries,x=>x[1]),out={};if(base<=0||total<=0){for(const [name] of entries)out[name]=0;return out}let used=0;for(const [name,v] of entries){const n=Math.max(0,Math.floor((total*v/base)/unit)*unit);out[name]=n;used+=n}return out}
function goalRecommendation(type,key){const unit=type==='daily'?100:1000,base=type==='daily'?recommendedDaily(key):recommendedMonth(key),current=type==='daily'?spentDate(key):spentMonth(key),dataCount=type==='daily'?sameWeekdaySpendHistory(key,3).length:Array.from({length:3},(_,i)=>addMonths(key,-i-1)).filter(hasMonthSpendData).length,rawCategories=goalCategoryHistory(type,key),categories=scaleGoalCategories(rawCategories,base,type==='daily'?100:500);return{base,low:roundGoalAmount(base*.9,unit),high:roundGoalAmount(base*1.1,unit),current,dataCount,sparse:dataCount<2,categories,explanation:type==='daily'?'過去3週間の同じ曜日から':'過去3ヶ月の支出から'}}
function weekdaySpendingWeights(month,weeks=8){const [y,m]=month.split('-').map(Number),anchor=new Date(y,m-1,1),values=Array.from({length:7},()=>[]);for(let i=1;i<=weeks*7;i++){const d=new Date(anchor);d.setDate(d.getDate()-i);const ds=ymd(d);if(hasDailySpendData(ds))values[d.getDay()].push(spentDate(ds))}const count=sum(values,a=>a.length),sparse=count<4,weights=sparse?Array(7).fill(1):values.map(a=>a.length?Math.max(1,sum(a)/a.length):1);return{weights,sparse}}
function buildMonthlyDailyPlan(month,total,existingDaily={}){const days=daysInMonth(month),today=ymd(),todayMonth=ym(),todayDay=parseYmd(today).getDate(),futureStart=month===todayMonth?todayDay:(month>todayMonth?1:days+1),plan={};for(const [k,v] of Object.entries(existingDaily||{}))if(Number(v)>0)plan[Number(k)]=Number(v);if(futureStart>days)return{plan,sparse:true};let remaining=Math.max(0,Number(total)||0);if(month===todayMonth)remaining=Math.max(0,remaining-spentMonth(month));else if(month<todayMonth)return{plan,sparse:true};const candidates=[];let protectedRemaining=0;for(let day=futureStart;day<=days;day++){const ds=`${month}-${pad(day)}`,raw=data.dailyGoals[ds];if(raw?.origin==='daily'&&Number(raw.total)>0){plan[day]=Number(raw.total);protectedRemaining+=Math.max(0,Number(raw.total)-(ds===today?spentDate(ds):0));continue}delete plan[day];candidates.push(day)}remaining=Math.max(0,remaining-protectedRemaining);const {weights,sparse}=weekdaySpendingWeights(month,8),weightSum=sum(candidates,d=>weights[parseYmd(`${month}-${pad(d)}`).getDay()]);let allocated=0;for(let i=0;i<candidates.length;i++){const day=candidates[i],ds=`${month}-${pad(day)}`,last=i===candidates.length-1,share=last?Math.max(0,remaining-allocated):Math.max(0,Math.floor((remaining*(weights[parseYmd(ds).getDay()]/Math.max(1,weightSum)))/100)*100);allocated+=share;plan[day]=share+(ds===today?spentDate(ds):0)}return{plan,sparse}}
function goalStepIndicator(state){const count=4;return `<div class="goal-step-indicator">${Array.from({length:count},(_,i)=>{const n=i+1,cls=n<state.step?'done':n===state.step?'current':'';return `${i?`<span class="goal-step-line ${n<=state.step?'done':''}"></span>`:''}<span class="goal-step-node ${cls}">${n<state.step?icon('check'):n}</span>`}).join('')}</div>`}
function goalIntroHtml(state){const r=state.recommendation,existing=state.type==='daily'?dailyGoal(state.key).total:monthlyGoal(state.key).total,title=state.type==='daily'?'今日の使い方を\n計画しましょう':'今月のお金の使い方を\n計画しましょう',historyLabel=state.type==='daily'?'過去の同じ曜日':'過去3ヶ月平均',currentLabel=state.type==='daily'?'今日すでに使った金額':'今月すでに使用';return `<div class="goal-planner-shell"><div class="goal-intro-card"><div class="goal-intro-icon">${icon('target')}</div><div class="goal-intro-title">${title}</div><div class="goal-intro-copy">${state.type==='daily'?'これまでの支出傾向を見ながら、今日ちょうどいい目標を一緒に作ります。':'過去3ヶ月の傾向やカテゴリ別支出から、今月の目標を組み立てます。'}</div><div class="goal-intro-stats"><div class="row"><div class="row-main"><div class="row-title">${historyLabel}</div></div><div class="row-value">${yen(r.base)}</div></div><div class="row"><div class="row-main"><div class="row-title">${currentLabel}</div></div><div class="row-value">${yen(r.current)}</div></div>${existing?`<div class="row"><div class="row-main"><div class="row-title">現在の目標</div></div><div class="row-value">${yen(existing)}</div></div>`:''}</div><div class="goal-data-note">${r.explanation}${r.sparse?'・まだ記録が少ないため参考値です':''}</div><div class="goal-intro-actions"><button type="button" class="primary" id="goalStart">${existing?'目標を見直す':'計画をはじめる'}</button><button type="button" class="secondary" id="goalCancel">今はしない</button></div></div></div>`}
function goalRecommendationStepHtml(state){const r=state.recommendation,options=[['節約',r.low],['おすすめ',r.base],['ゆとり',r.high]],warning=state.draft.total<r.current?`<div class="goal-warning">選択した目標は、すでに使った金額 ${yen(r.current)} を下回っています。</div>`:'';return `${goalStepIndicator(state)}<div class="goal-step-frame ${state.direction<0?'back':''}"><div class="goal-step-title">${state.type==='daily'?'今日':'今月'}のプランを選ぶ</div><div class="goal-step-copy">${r.explanation}を基準に3つの案を用意しました。</div><div class="goal-recommend-grid">${options.map(([label,value])=>`<button type="button" class="goal-recommend ${state.draft.total===value?'selected':''}" data-goal-plan="${value}"><div class="goal-recommend-label">${label}</div><div class="goal-recommend-amount">${yen(value)}</div></button>`).join('')}</div>${warning}<div class="goal-data-note">${r.sparse?'まだ記録が少ないため参考値です。':'記録済みの実質支出修正も推薦値へ反映しています。'}</div><div class="goal-nav-actions single"><button type="button" class="primary" id="goalNext">次へ</button></div></div>`}
function goalAmountStepHtml(state){const unit=state.type==='daily'?100:1000,r=state.recommendation,spent=r.current,total=state.draft.total,remain=total-spent,max=Math.max(unit*10,r.high*1.7,spent*1.35,total*1.3),warning=total<spent?`<div class="goal-warning">現在の支出 ${yen(spent)} を下回っています。必要なら目標を引き上げてください。</div>`:'';return `${goalStepIndicator(state)}<div class="goal-step-frame ${state.direction<0?'back':''}"><div class="goal-step-title">総額を調整</div><div class="goal-step-copy">金額をタップすると電卓で直接入力できます。</div><div class="goal-amount-card"><div class="hero-kicker">${state.type==='daily'?'今日の目標':'月間目標'}</div><button type="button" class="goal-main-amount" id="goalAmountEdit">${yen(total)}</button><div class="goal-amount-meta"><div><span>残り使える金額</span><strong class="${remain<0?'red':''}">${yen(remain)}</strong></div><div><span>すでに使用</span><strong>${yen(spent)}</strong></div></div><input class="goal-range" id="goalAmountRange" type="range" min="0" max="${Math.ceil(max/unit)*unit}" step="${unit}" value="${clamp(total,0,Math.ceil(max/unit)*unit)}"><button type="button" class="goal-reset" id="goalResetAmount">おすすめ額 ${yen(r.base)} に戻す</button></div>${warning}<div class="goal-nav-actions"><button type="button" class="secondary" id="goalBack">戻る</button><button type="button" class="primary" id="goalNext">次へ</button></div></div>`}
function goalCategoryStepHtml(state){const total=state.draft.total,catSum=sum(Object.values(state.draft.categories),v=>Number(v)||0),unallocated=total-catSum;return `${goalStepIndicator(state)}<div class="goal-step-frame ${state.direction<0?'back':''}"><div class="goal-step-title">カテゴリ配分</div><div class="goal-step-copy">過去の支出構成から自動配分しています。0円のカテゴリがあっても構いません。</div><div class="goal-allocation-summary"><span>未割当金額</span><strong class="${unallocated<0?'over':''}">${yen(unallocated)}</strong></div>${unallocated<0?'<div class="goal-warning">カテゴリ合計が総目標を超えています。承認前に調整してください。</div>':''}<div class="goal-category-list">${data.categories.map(c=>`<button type="button" class="goal-category-row" data-goal-cat="${esc(c.name)}">${categoryIconHtml(c,'settings-icon')}<div class="row-main"><div class="row-title">${esc(c.name)}</div></div><div class="row-value">${yen(Number(state.draft.categories[c.name])||0)}</div><span class="chev">›</span></button>`).join('')}</div><button type="button" class="goal-reset" id="goalResetCategories">おすすめ配分に戻す</button><div class="goal-nav-actions"><button type="button" class="secondary" id="goalBack">戻る</button><button type="button" class="primary" id="goalNext">次へ</button></div></div>`}
function goalReviewHtml(state){const total=state.draft.total,spent=state.recommendation.current,remain=total-spent,catSum=sum(Object.values(state.draft.categories),v=>Number(v)||0),unallocated=total-catSum;return `${goalStepIndicator(state)}<div class="goal-step-frame ${state.direction<0?'back':''}"><div class="goal-step-title">確認</div><div class="goal-step-copy">内容を確認し、スライダーを右端まで動かすと承認します。</div><div class="goal-review-hero"><div class="goal-review-title">${state.type==='daily'?'今日の目標':monthLabel(state.key)+'の目標'}</div><div class="goal-review-amount">${yen(total)}</div><div class="goal-review-meta"><div><span>使用済み</span><strong>${yen(spent)}</strong></div><div><span>残り</span><strong class="${remain<0?'red':''}">${yen(remain)}</strong></div></div></div><div class="section-head">カテゴリ</div><div class="group">${data.categories.filter(c=>Number(state.draft.categories[c.name])>0).map(c=>`<div class="row">${categoryIconHtml(c,'settings-icon')}<div class="row-main"><div class="row-title">${esc(c.name)}</div></div><div class="row-value">${yen(Number(state.draft.categories[c.name])||0)}</div></div>`).join('')}${unallocated>0?`<div class="row"><div class="row-main"><div class="row-title">未割当</div></div><div class="row-value">${yen(unallocated)}</div></div>`:''}</div>${catSum>total?'<div class="goal-warning">カテゴリ合計が総目標を超えています。戻って調整してください。</div>':''}<div class="goal-nav-actions single"><button type="button" class="secondary" id="goalBack">戻る</button></div><div class="approval-slider" id="goalApproval"><div class="approval-progress"></div><div class="approval-label">右へスライドして承認 →</div><button type="button" class="approval-handle" aria-label="右へスライドして承認">${icon('chevronRight')}</button></div></div>`}

function createGoalPlanner(type,key){const recommendation=goalRecommendation(type,key),raw=type==='daily'?(data.dailyGoals[key]||{}):(data.monthlyGoals[key]||{}),existingTotal=Number(raw.total)||0,baseTotal=existingTotal||recommendation.base,existingCategories=raw.categories&&Object.keys(raw.categories).length?clone(raw.categories):scaleGoalCategories(goalCategoryHistory(type,key),baseTotal,type==='daily'?100:500);return{type,key,step:0,direction:1,locked:false,processing:false,success:false,error:'',recommendation,draft:{total:baseTotal,categories:existingCategories},viewId:null}}

function openGoalPlanner(type,key){if(goalPlannerState)return;goalPlannerState=createGoalPlanner(type,key);const title=type==='daily'?'当日目標':'月間目標',view=pushView(title,'',root=>{goalPlannerState.viewId=root.id;root.querySelector('.back-btn').onclick=()=>{if(goalPlannerState?.locked)return;goalPlannerState=null;popView()}});renderGoalPlanner();return view}

function disconnectGmail(){const done=()=>{gmailAccessToken='';gmailTokenExpiresAt=0;sessionStorage.removeItem(GMAIL_TOKEN_KEY);sessionStorage.removeItem(GMAIL_TOKEN_EXP_KEY);data.gmailSettings.emailAddress='';save();renderAll()};try{if(gmailAccessToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(gmailAccessToken,done);else done()}catch(e){done()}}
async function syncGmail({silent=false}={}){if(gmailSyncing)return;if(!gmailTokenValid()){if(!silent)await connectGmail();return}gmailSyncing=true;renderAll();try{const q=String(data.gmailSettings.query||DEFAULT_DATA.gmailSettings.query).trim();let pageToken='',ids=[],pages=0;do{const u=new URL('https://gmail.googleapis.com/gmail/v1/users/me/messages');u.searchParams.set('maxResults','100');if(q)u.searchParams.set('q',q);if(pageToken)u.searchParams.set('pageToken',pageToken);const list=await gmailFetch(u.toString());ids.push(...(list.messages||[]).map(x=>x.id));pageToken=list.nextPageToken||'';pages++}while(pageToken&&pages<3);const byEmail=new Map(data.mailImports.map(x=>[x.emailId,x])),targets=ids.filter(id=>{const old=byEmail.get(id);return !old||Number(old.parserVersion||0)<GMAIL_PARSER_VERSION}).slice(0,200);let added=0,reparsed=0;for(let i=0;i<targets.length;i+=6){const batch=targets.slice(i,i+6),messages=await Promise.all(batch.map(id=>gmailFetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${encodeURIComponent(id)}?format=full`)));for(const msg of messages){const old=byEmail.get(msg.id),parsed=await parseFinancialMessage(msg);if(!old){if(parsed){data.mailImports.push(parsed);if(parsed.status==='imported')importMailToLedger(parsed,{saveNow:false});added++;byEmail.set(msg.id,parsed)}continue}if(old.userResolved){if(parsed){old.date=parsed.date;old.receivedAt=parsed.receivedAt;old.parserVersion=GMAIL_PARSER_VERSION;const tx=data.transactions.find(x=>x.id===old.transactionId);if(tx)tx.date=parsed.date}reparsed++;continue}const before={transactions:clone(data.transactions),banks:clone(data.banks),assetSnapshots:clone(data.assetSnapshots),mail:clone(old),notices:clone(data.notices)};try{if(old.transactionId){const tx=data.transactions.find(x=>x.id===old.transactionId);if(tx)reverseBankEffectForTransaction(tx);data.transactions=data.transactions.filter(x=>x.id!==old.transactionId)}if(!parsed){Object.assign(old,{status:'ignored',parserVersion:GMAIL_PARSER_VERSION,ignoredReason:'金融取引対象外',transactionId:'',bankApplied:false,bankReconciled:false});reparsed++;continue}const keep={id:old.id,createdAt:old.createdAt||parsed.createdAt};Object.assign(old,parsed,keep,{transactionId:''});if(old.status==='imported')importMailToLedger(old,{saveNow:false});reparsed++}catch(err){data.transactions=before.transactions;data.banks=before.banks;data.assetSnapshots=before.assetSnapshots;data.notices=before.notices;Object.assign(old,before.mail);throw err}}}data.gmailSettings.lastSyncAt=new Date().toISOString();save();if(!silent)addNotice('Gmail同期完了',added||reparsed?`新規${added}件・再判定${reparsed}件を処理しました。`:'新しい金融メールはありません。');refreshUnknownMailView();renderAll()}catch(e){console.error(e);if(!silent)showAlert('Gmail同期に失敗しました',e.message)}finally{gmailSyncing=false;renderAll()}}
function maybeAutoSyncGmail(force=false){if(!data.gmailSettings.autoSync||!gmailTokenValid()||gmailSyncing)return;const mins=Math.max(1,Number(data.gmailSettings.syncMinutes)||5),last=Date.parse(data.gmailSettings.lastSyncAt||0)||0;if(force||Date.now()-last>=mins*60000){if(Date.now()-gmailLastAutoAttempt<30000)return;gmailLastAutoAttempt=Date.now();syncGmail({silent:true})}}
function openGmailSettings(){let auto=!!data.gmailSettings.autoSync,selected=new Set(Array.isArray(data.gmailSettings.sourceIds)?data.gmailSettings.sourceIds:[]);const sources=[...data.banks.map(b=>({id:b.id,name:b.name,sub:'銀行口座',icon:'bank',color:'var(--blue)'})),...data.cards.map(c=>({id:c.id,name:c.name,sub:'クレジットカード',icon:'card',color:'var(--purple)'})),...data.debitCards.map(d=>({id:d.id,name:d.name,sub:`デビット・${bankById(d.bankId)?.name||'口座未設定'}`,icon:'wallet',color:'var(--teal)'}))];openSheet(`<div class="sheet-nav"><button type="button" class="nav-text" id="gsCancel">閉じる</button><div class="sheet-title">Gmail自動取得</div><button type="button" class="nav-text bold" id="gsSave">保存</button></div><div class="sheet-body"><div class="form-section"><div class="form-label">Google OAuth クライアントID</div><input class="field" id="gsClient" value="${esc(data.gmailSettings.clientId||'')}" placeholder="xxxxx.apps.googleusercontent.com"><div class="row-sub" style="margin-top:6px">既存のGoogle Cloud設定をそのまま使用できます。Client Secretは入力しません。</div></div><div class="form-section"><div class="form-label">自動反映する銀行・カード・デビット</div>${sources.length?`<div class="group">${sources.map(x=>`<button type="button" class="row press" data-gsource="${x.id}"><div class="settings-icon" style="background:${x.color}">${icon(x.icon)}</div><div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${esc(x.sub)}</div></div><span class="source-check ${selected.has(x.id)?'on':''}">${selected.has(x.id)?icon('check'):''}</span></button>`).join('')}</div>`:'<div class="empty">銀行口座・カード・デビットを登録すると対象を選択できます。</div>'}<div class="row-sub">何も選択しない場合は、認識できるすべての金融メールを対象にします。</div></div><div class="form-section"><div class="form-label">Gmail検索条件</div><textarea class="field" id="gsQuery">${esc(data.gmailSettings.query||DEFAULT_DATA.gmailSettings.query)}</textarea></div><div class="form-section"><div class="form-label">起動中の自動同期間隔（分）</div><input class="field" id="gsMins" type="number" min="1" max="60" value="${Number(data.gmailSettings.syncMinutes)||5}"></div><div class="group"><div class="row"><div class="row-main"><div class="row-title">起動中に自動同期</div></div><button type="button" class="switch ${auto?'on':''}" id="gsAuto"></button></div></div><div class="card card-pad"><div class="row-title">接続状態</div><div class="hero-sub">${esc(gmailStatusLabel())}<br>最終同期 ${formatSyncTime(data.gmailSettings.lastSyncAt)}</div></div>${gmailConnected()?'<button type="button" class="primary" id="gsSync">今すぐ同期</button><button type="button" class="secondary" id="gsDisconnect" style="margin-top:10px">Gmail接続を解除</button>':'<button type="button" class="primary" id="gsConnect">Googleアカウントに接続</button>'}</div>`,'full',root=>{root.querySelector('#gsCancel').onclick=closeSheet;root.querySelector('#gsAuto').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('on',auto)};root.querySelectorAll('[data-gsource]').forEach(b=>b.onclick=()=>{const id=b.dataset.gsource;selected.has(id)?selected.delete(id):selected.add(id);const ck=b.querySelector('.source-check');ck.classList.toggle('on',selected.has(id));ck.innerHTML=selected.has(id)?icon('check'):''});const persist=()=>{const before=JSON.stringify((data.gmailSettings.sourceIds||[]).slice().sort());data.gmailSettings.clientId=root.querySelector('#gsClient').value.trim();data.gmailSettings.query=root.querySelector('#gsQuery').value.trim()||DEFAULT_DATA.gmailSettings.query;data.gmailSettings.syncMinutes=clamp(Number(root.querySelector('#gsMins').value)||5,1,60);data.gmailSettings.autoSync=auto;data.gmailSettings.sourceIds=[...selected];if(before!==JSON.stringify([...selected].sort()))data.mailImports.forEach(x=>x.parserVersion=0);save()};root.querySelector('#gsSave').onclick=()=>{persist();closeSheet();renderAll()};root.querySelector('#gsConnect')?.addEventListener('click',()=>{persist();closeSheet();setTimeout(connectGmail,320)});root.querySelector('#gsSync')?.addEventListener('click',()=>{persist();closeSheet();setTimeout(()=>syncGmail(),320)});root.querySelector('#gsDisconnect')?.addEventListener('click',()=>{closeSheet();setTimeout(disconnectGmail,320)})})}
function unknownMailListHtml(){const list=data.mailImports.filter(x=>x.status==='pending');return list.length?`<div class="group">${list.map(mi=>`<button type="button" class="row press" data-mi="${mi.id}" style="border-left:0;border-right:0;border-top:0"><div class="settings-icon" style="background:var(--orange)">${icon('help')}</div><div class="row-main"><div class="row-title">${esc(mi.merchant||mi.subject||mi.sourceName)}</div><div class="row-sub">${mi.date||'日付不明'}・${esc(mi.sourceName||'Gmail')}・${mi.amount?yen(mi.amount):'金額不明'}</div></div><span class="chev">›</span></button>`).join('')}</div>`:'<div class="empty">カテゴリー不明の取引はありません。</div>'}
function bindUnknownMailList(root){root.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>openMailResolve(b.dataset.mi))}
function refreshUnknownMailView(){const top=pushStack[pushStack.length-1];if(!top||top.title!=='カテゴリー不明')return;const v=document.getElementById(top.id),body=v?.querySelector('.push-body');if(!body)return;body.innerHTML=unknownMailListHtml();bindUnknownMailList(body)}
function openUnknownMail(){pushView('カテゴリー不明',unknownMailListHtml(),root=>bindUnknownMailList(root))}
function openMailResolve(id){const mi=data.mailImports.find(x=>x.id===id);if(!mi||mi.status!=='pending')return;let amount=Number(mi.amount)||0,cat=mi.category||'その他';openSheet(`<div class="sheet-nav"><button type="button" class="nav-text" id="mrCancel">キャンセル</button><div class="sheet-title">取引を確認</div><button type="button" class="nav-text bold" id="mrSave">保存</button></div><div class="sheet-body" id="mrBody"><div class="form-section"><div class="form-label">利用先・内容</div><input class="field" id="mrMerchant" value="${esc(mi.merchant||'')}" placeholder="利用先を入力"><div class="form-error hidden" id="mrMerchantError">利用先を入力してください。</div></div><div class="form-section">${moneyButton('mrAmount','利用金額',amount)}<div class="form-error hidden" id="mrAmountError">利用金額を入力してください。</div></div><div class="form-section"><div class="form-label">カテゴリ</div><div class="choice-grid">${data.categories.map(c=>`<button type="button" class="choice category-choice ${c.name===cat?'on':''}" data-mrc="${esc(c.name)}"><span class="category-choice-symbol">${categoryIconHtml(c,'choice-symbol')}</span><span>${esc(c.name)}</span></button>`).join('')}</div></div><div class="card card-pad"><div class="row-sub">${esc(mi.sourceName||'Gmail')}・${mi.date||'日付不明'}<br>${esc(mi.subject||'')}</div></div><button type="button" class="secondary danger" id="mrIgnore">このメールを取引として扱わない</button></div>`,'half',root=>{const merchant=root.querySelector('#mrMerchant'),amountBtn=root.querySelector('#mrAmount'),body=root.querySelector('#mrBody'),merchantError=root.querySelector('#mrMerchantError'),amountError=root.querySelector('#mrAmountError'),clearErrors=()=>{merchant.classList.remove('field-error');merchantError.classList.add('hidden');amountBtn.classList.remove('field-error');amountError.classList.add('hidden')};amountBtn.onclick=()=>openCalculator('利用金額',amount,v=>{amount=v;amountBtn.querySelector('.val').textContent=yen(v);if(v){amountBtn.classList.remove('field-error');amountError.classList.add('hidden')}});root.querySelectorAll('[data-mrc]').forEach(b=>b.onclick=()=>{cat=b.dataset.mrc;root.querySelectorAll('[data-mrc]').forEach(x=>x.classList.toggle('on',x===b))});root.querySelector('#mrCancel').onclick=closeSheet;root.querySelector('#mrIgnore').onclick=()=>{mi.status='ignored';mi.userResolved=true;mi.ignoredReason='ユーザーが取引対象外に設定';mi.parserVersion=GMAIL_PARSER_VERSION;save();closeSheet();refreshUnknownMailView();renderAll()};root.querySelector('#mrSave').onclick=()=>{clearErrors();const merchantValue=merchant.value.trim();let invalid=false;if(!merchantValue){merchant.classList.add('field-error');merchantError.classList.remove('hidden');invalid=true}if(!(amount>0)){amountBtn.classList.add('field-error');amountError.classList.remove('hidden');invalid=true}if(invalid){body.scrollTo({top:0,behavior:'smooth'});merchantValue?amountBtn.focus?.():merchant.focus();return}mi.merchant=merchantValue;mi.amount=amount;mi.category=cat;mi.status='imported';mi.userResolved=true;mi.categorySource='manual';mi.parserVersion=GMAIL_PARSER_VERSION;data.merchantRules[normalizeMerchantKey(merchantValue)]=cat;const entity=matchFinancialEntity(mi.sourceName,mi.type);mi.paymentMethod=entity.method;mi.paymentId=entity.id;mi.linkedBankId=entity.linkedBankId||'';const tx=importMailToLedger(mi);if(!tx){showAlert('保存できませんでした','取引の保存に失敗しました。入力内容を確認してください。');return}save();closeSheet();refreshUnknownMailView();renderAll()}})}
function openMailHistory(){const list=[...data.mailImports].sort((a,b)=>String(b.receivedAt||'').localeCompare(String(a.receivedAt||''))),groups=new Map();for(const mi of list){const k=mi.sourceName||'その他';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(mi)}const html=list.length?[...groups.entries()].map(([source,items])=>`<div class="section-head">${esc(source)}・${items.length}件</div><div class="group">${items.map(mi=>`<button class="row press" data-mail-history="${mi.id}" style="width:100%;border-left:0;border-right:0;border-top:0;text-align:left"><div class="settings-icon" style="background:${mi.status==='pending'?'var(--orange)':mi.status==='ignored'?'#8E8E93':catByName(mi.category).color}">${mi.status==='pending'?'?':mi.status==='ignored'?'×':catIcon(mi.category)}</div><div class="row-main"><div class="row-title">${esc(mi.merchant||mi.subject||source)}</div><div class="row-sub">${mi.date||''}・${mi.status==='pending'?'要確認':mi.status==='ignored'?'除外':esc(mi.category||'')}・${esc(mi.type||'')}</div></div><div class="row-value">${mi.amount?yen(mi.amount):'—'}</div><span class="chev">›</span></button>`).join('')}</div>`).join(''):'<div class="empty">メール取引履歴はありません。</div>';pushView('メール取引履歴',html,root=>root.querySelectorAll('[data-mail-history]').forEach(b=>b.onclick=()=>{const mi=data.mailImports.find(x=>x.id===b.dataset.mailHistory);if(mi?.status==='pending')openMailResolve(mi.id);else if(mi?.transactionId)openTransactionDetail(mi.transactionId)}))}
function renderLock(){const l=document.getElementById('lockScreen');if(!data.security.enabled||!data.security.passcode){l.classList.remove('show');return}let entered='';l.classList.add('show');document.getElementById('lockDots').innerHTML=[0,1,2,3].map(()=>'<span class="lock-dot"></span>').join('');document.getElementById('lockPad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="lock-key" data-lk="${k}">${k}</button>`).join('');const draw=()=>document.querySelectorAll('#lockDots .lock-dot').forEach((d,i)=>d.classList.toggle('on',i<entered.length));document.querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>{const k=b.dataset.lk;if(k==='⌫')entered=entered.slice(0,-1);else if(entered.length<4)entered+=k;draw();if(entered.length===4){if(entered===data.security.passcode){setTimeout(()=>l.classList.remove('show'),150)}else{entered='';draw();l.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:250})}}})}
let appHiddenAt=0;function handleVisibilityChange(){if(document.hidden){appHiddenAt=Date.now();return}if(data.security.enabled&&data.security.relock!=='never'&&appHiddenAt){const elapsed=Date.now()-appHiddenAt,delay=data.security.relock==='5m'?300000:data.security.relock==='1m'?60000:0;if(elapsed>=delay)renderLock()}if(document.visibilityState==='visible')maybeAutoSyncGmail(true)}document.addEventListener('visibilitychange',handleVisibilityChange)
function renderAll(){processScheduled();generateSystemNotices();applyAppearance();if(activeTab==='today')renderToday();else if(activeTab==='month')renderMonth();else if(activeTab==='pay')renderPay();else if(activeTab==='assets')renderAssets();else renderSettings()}
renderAll();renderLock();
setTimeout(()=>maybeAutoSyncGmail(true),1800);setInterval(()=>maybeAutoSyncGmail(false),60000);
</script>

function processAutomaticTransactions(refDate=new Date()){
  const today=todayStr(refDate);let cardCount=0,cardTotal=0,salaryCount=0,salaryTotal=0,changed=false;
  for(const card of data.cards){
    if(card.paid||card.autoPaidAt||!card.bankId||!card.dueDay)continue;
    const due=cardDueDate(card);if(!due||due>today)continue;
    const bank=bankById(card.bankId);if(!bank)continue;
    const amount=Math.max(0,Number(card.amount)||0);const txId=uid('tx');
    bank.balance=(Number(bank.balance)||0)-amount;bank.updatedAt=new Date().toISOString();
    card.paid=true;card.autoPaidAt=due;card.autoTransactionId=txId;
    data.transactions.push({id:txId,bankId:bank.id,type:'card_auto',refId:card.id,amount:-amount,date:due,createdAt:new Date().toISOString(),memo:`${card.name||'クレジットカード'} 自動引落`});
    cardCount++;cardTotal+=amount;changed=true;
  }
  for(const salary of data.salaries){
    if(salary.received||salary.autoReceivedAt)continue;
    const isTemporary=salary.incomeType==='temporary';
    const emp=isTemporary?null:employerById(salary.employerId);
    const bankId=isTemporary?salary.bankId:emp?.bankId;
    const payDay=isTemporary?salary.payDay:emp?.payDay;
    if(!bankId||!payDay||(!isTemporary&&!emp))continue;
    const due=salaryDueDate(salary);if(!due||due>today)continue;
    const bank=bankById(bankId);if(!bank)continue;
    const amount=Math.max(0,Number(salary.amount)||0);const txId=uid('tx');
    bank.balance=(Number(bank.balance)||0)+amount;bank.updatedAt=new Date().toISOString();
    salary.received=true;salary.autoReceivedAt=due;salary.autoTransactionId=txId;
    const incomeName=isTemporary?(salary.name||'臨時収入'):(emp?.name||salary.name||'給与');
    data.transactions.push({id:txId,bankId:bank.id,type:isTemporary?'temporary_income_auto':'salary_auto',refId:salary.id,amount:amount,date:due,createdAt:new Date().toISOString(),memo:`${incomeName} 自動入金`});
    salaryCount++;salaryTotal+=amount;changed=true;
  }
  if(changed){
    save();const parts=[];if(salaryCount)parts.push(`収入${salaryCount}件 ${yen(salaryTotal)}を自動入金`);if(cardCount)parts.push(`カード${cardCount}件 ${yen(cardTotal)}を自動引落`);sessionNotice=parts.join('、')+'しました。';
  }
  return {cardCount,cardTotal,salaryCount,salaryTotal,count:cardCount+salaryCount};
}
function monthFlows(month){
  const salaryAll=data.salaries.filter(x=>x.month===month);const salaryIncoming=sum(salaryAll.filter(x=>!x.received),x=>x.amount),salaryReceived=sum(salaryAll.filter(x=>x.received),x=>x.amount);
  const cardAll=data.cards.filter(x=>x.month===month);const cardUnpaid=sum(cardAll.filter(x=>!x.paid),x=>x.amount),cardPaid=sum(cardAll.filter(x=>x.paid),x=>x.amount);
  const expenseAll=data.expenses.filter(x=>x.month===month);const expenseUnpaid=sum(expenseAll.filter(x=>!x.paid),x=>x.amount),expensePaid=sum(expenseAll.filter(x=>x.paid),x=>x.amount);
  return {salaryIncoming,salaryReceived,cardUnpaid,cardPaid,expenseUnpaid,expensePaid,netFlow:salaryIncoming-cardUnpaid-expenseUnpaid};
}
function projectedOpeningBank(month){
  const actualBank=sum(data.banks,b=>b.balance),base=todayStr().slice(0,7);
  if(month<=base)return actualBank;
  let bank=actualBank,m=base,safety=0;
  while(m<month&&safety++<36){const f=monthFlows(m);bank+=f.netFlow;m=addMonth(m,1)}
  return bank;
}
function monthStats(month=currentMonth){
  const f=monthFlows(month),actualBank=sum(data.banks,b=>b.balance),bank=projectedOpeningBank(month),available=bank+f.salaryIncoming,due=f.cardUnpaid+f.expenseUnpaid,margin=available-due;
  return {actualBank,bank,projected:month>todayStr().slice(0,7),...f,available,due,margin,monthEndSavings:margin};
}
function marginRank(stats){
  if(stats.margin<0)return{rank:'E',label:'不足',cls:'rank-e'};
  if(stats.due<=0){
    if((stats.cardPaid||0)+(stats.expensePaid||0)>0)return{rank:'済',label:'支払い完了',cls:'rank-b'};
    return{rank:'—',label:'支払いなし',cls:'rank-d'};
  }
  if(stats.available<=0)return{rank:'—',label:'未算出',cls:'rank-d'};
  const ratio=stats.available>0?(stats.margin/stats.available)*100:0;
  if(ratio>=50)return{rank:'S',label:'かなり余裕',cls:'rank-s'};
  if(ratio>=35)return{rank:'A',label:'余裕あり',cls:'rank-a'};
  if(ratio>=20)return{rank:'B',label:'やや余裕',cls:'rank-b'};
  if(ratio>=10)return{rank:'C',label:'注意',cls:'rank-c'};
  return{rank:'D',label:'余裕少なめ',cls:'rank-d'};
}

let calcDisplay='0',calcAccumulator=null,calcPending=null,calcWaiting=false,calcExpression='',calcApplyCallback=null;
function calcNumber(){const n=Number(calcDisplay.replace(/,/g,''));return Number.isFinite(n)?n:0}
function formatCalcDisplay(raw){const n=Number(raw);if(!Number.isFinite(n))return 'エラー';const s=String(raw);if(s.includes('.')){const[a,b]=s.split('.');return Number(a||0).toLocaleString('ja-JP')+'.'+b}return Math.round(n).toLocaleString('ja-JP')}

function inputCalcDigit(d){const chunk=String(d);const normalized=chunk==='00'?'0':chunk;if(calcWaiting){calcDisplay=normalized;calcWaiting=false}else if(calcDisplay==='0'){calcDisplay=normalized}else{const digits=calcDisplay.replace('-','').replace('.','').length;if(digits+chunk.length<=12)calcDisplay+=chunk}updateCalc()}
function calcBackspace(){if(calcWaiting){calcDisplay='0';calcWaiting=false;return updateCalc()}if(calcDisplay==='0')return updateCalc();let next=calcDisplay.slice(0,-1);if(!next||next==='-'||next==='-0')next='0';calcDisplay=next;updateCalc()}
function inputCalcDot(){return}
function performCalc(a,b,op){if(op==='+')return a+b;if(op==='-')return a-b;if(op==='*')return a*b;if(op==='/')return b===0?0:a/b;return b}
function calcOperate(op){const value=calcNumber();if(calcPending&&calcAccumulator!=null&&!calcWaiting){calcAccumulator=performCalc(calcAccumulator,value,calcPending);calcDisplay=String(Math.round(calcAccumulator))}else if(calcAccumulator==null)calcAccumulator=value;calcPending=op;calcExpression=`${formatCalcDisplay(calcAccumulator)}円 ${op==='+'?'＋':op==='-'?'−':op==='*'?'×':'÷'}`;calcWaiting=true;updateCalc()}
function calcEquals(){if(calcPending==null||calcAccumulator==null)return;const b=calcNumber(),a=calcAccumulator,op=calcPending,r=performCalc(a,b,op);calcExpression=`${formatCalcDisplay(a)} ${op==='+'?'＋':op==='-'?'−':op==='*'?'×':'÷'} ${formatCalcDisplay(b)} ＝`;calcDisplay=String(Math.round(r));calcAccumulator=null;calcPending=null;calcWaiting=true;updateCalc()}
function handleCalcKey(k){if(/^\d{1,2}$/.test(k))return inputCalcDigit(k);if(k==='backspace')return calcBackspace();if(k==='clear'){calcDisplay='0';calcExpression='';calcAccumulator=null;calcPending=null;calcWaiting=false;return updateCalc()}if(k==='sign'){calcDisplay=String(-calcNumber());return updateCalc()}if(k==='percent'){calcDisplay=String(Math.round(calcNumber()/100));return updateCalc()}if(['+','-','*','/'].includes(k))return calcOperate(k);if(k==='=')return calcEquals()}
document.getElementById('calcGrid').onclick=e=>{const b=e.target.closest('[data-key]');if(b)handleCalcKey(b.dataset.key)};document.getElementById('calcClose').onclick=closeMoneyCalculator;document.getElementById('calcApply').onclick=()=>{const cb=calcApplyCallback,value=Math.max(0,Math.round(calcNumber()));closeMoneyCalculator();if(cb)cb(value)};

function categoryForMerchant(merchant,context=''){
  const key=normalizeMerchantKey(merchant);
  const ctx=normalizeMerchantKey(context);
  if(!key&&!ctx)return null;
  // 学習済みルールは、短すぎる部分一致で誤爆しないよう厳格化。
  const learned=Object.entries(data.merchantRules||{}).sort((a,b)=>String(b[0]).length-String(a[0]).length).find(([k])=>{
    const nk=normalizeMerchantKey(k);if(!nk)return false;return key===nk||(nk.length>=4&&key.includes(nk));
  });if(learned)return learned[1];
  // Amazon / Apple / Googleは購入内容が広いため加盟店名だけでは自動分類しない。
  if(key&&/amazon|アマゾン|apple|アップル|google|グーグル/.test(key))return null;
  // 加盟店名を最優先。Tap to Payもここでは交通として扱う。
  for(const [cat,keys] of MERCHANT_CATEGORY_RULES){if(key&&keys.some(k=>key.includes(normalizeMerchantKey(k))))return cat}
  // 加盟店抽出に失敗しても、本文に具体的な交通事業者名があれば交通候補にする。
  const transportContext=['jr西日本','jr東日本','jr東海','西日本旅客鉄道','東日本旅客鉄道','東海旅客鉄道','京都市交通局','京都市営地下鉄','京都市バス','icoca','suica','pasmo','pitapa','阪急電鉄','京阪電気鉄道','近畿日本鉄道','大阪メトロ','osaka metro','スマートex','ex予約'];
  if(ctx&&transportContext.some(k=>ctx.includes(normalizeMerchantKey(k))))return'交通';

function mailMonthSummaryHtml(){const list=monthMailImports(currentMonth),total=importedSpentForMonth(currentMonth),cats=DAILY_CATEGORIES.map(c=>({name:c.name,icon:c.icon,total:sum(list.filter(x=>x.category===c.name),x=>x.direction==='refund'?-Math.abs(x.amount):Math.abs(x.amount))})).filter(x=>x.total!==0);const recent=[...list].sort((a,b)=>String(b.receivedAt||'').localeCompare(String(a.receivedAt||''))).slice(0,12);return `<div class="section-head"><div class="section-title">Gmail自動取得</div><button class="section-action" id="outgoingGmailSync">${gmailSyncing?'同期中…':'同期'}</button></div><div class="mail-summary"><div class="mail-summary-top"><div class="mail-summary-amount">${yen(total)}</div><div class="mail-summary-sub">${monthLabel(currentMonth)}・${list.length}件（カード請求の口座引落は二重計上しません）</div></div>${cats.length?cats.map(x=>`<div class="mail-cat-row"><div>${x.icon}</div><div class="mail-cat-name">${esc(x.name)}</div><div class="mail-cat-val">${yen(x.total)}</div></div>`).join(''):'<div class="mail-cat-row"><div class="mail-cat-name">まだ自動取得された支出はありません。</div></div>'}</div>${recent.length?`<div class="list">${recent.map(x=>`<div class="today-entry-row"><div class="today-entry-icon">${categoryIcon(x.category||'その他')}</div><div class="today-entry-main"><div class="today-entry-name">${esc(x.merchant||x.sourceName)} <span class="mail-tx-source">${esc(importTypeLabel(x.type))}</span></div><div class="today-entry-sub">${esc(x.sourceName||'Gmail')}・${esc(x.date||'')}${x.status==='pending'?'・要確認':''}</div></div><div class="today-entry-amt">${yen(x.direction==='refund'?-x.amount:x.amount)}</div>${x.status==='pending'?`<button class="today-entry-del" data-fix-mail="${x.id}">確認</button>`:''}</div>`).join('')}</div>`:''}`}
function bindOutgoingGmailUI(){const b=document.getElementById('outgoingGmailSync');if(b)b.onclick=()=>gmailConnected()?syncGmail():switchTab('settings');document.querySelectorAll('[data-fix-mail]').forEach(x=>x.onclick=()=>openMailResolve(x.dataset.fixMail))}
function openGmailSettingsSheet(){
  ensureGmailData();showSheet(`<div class="sheet-head"><button class="sheet-btn" id="gmailSetCancel">閉じる</button><div class="sheet-title">Gmail自動取得</div><button class="sheet-btn bold" id="gmailSetSave">保存</button></div><div class="sheet-body"><div class="form-group"><label class="form-label">Google OAuth クライアントID</label><input class="input" id="gmailClientId" value="${esc(data.gmailSettings.clientId||'')}" placeholder="xxxxx.apps.googleusercontent.com" autocomplete="off"><div class="settings-note">GitHub PagesのURLをGoogle Cloud Consoleの「承認済みのJavaScript生成元」に登録し、Gmail APIを有効にしてください。Client IDは公開情報ですが、Client SecretはこのHTMLに入れないでください。</div></div><div class="form-group"><label class="form-label">Gmail検索条件</label><textarea class="input gmail-query" id="gmailQuery">${esc(data.gmailSettings.query||DEFAULT_DATA.gmailSettings.query)}</textarea><div class="settings-note">金融メールだけに絞るためのGmail検索式です。必要ならカード会社の送信元を追加できます。</div></div><div class="form-group"><label class="form-label">起動中の自動同期間隔（分）</label><input class="input" id="gmailMinutes" type="number" inputmode="numeric" min="1" max="60" value="${Math.max(1,Number(data.gmailSettings.syncMinutes)||5)}"></div><div class="toggle-row"><div><div class="toggle-text">起動中に自動同期</div><div class="employer-note">GitHub Pagesではアプリを閉じている間は実行されません。</div></div><button class="switch ${data.gmailSettings.autoSync?'on':''}" id="gmailAutoSwitch" type="button"></button></div><div class="info-card"><strong>接続状態</strong><br>${esc(gmailStatusLabel())}<br>最終同期：${esc(formatSyncTime(data.gmailSettings.lastSyncAt))}</div>${gmailConnected()?'<button class="btn btn-primary" id="gmailSyncFromSettings">今すぐ同期</button><button class="btn btn-secondary" id="gmailDisconnect">Gmail接続を解除</button>':'<button class="btn btn-primary" id="gmailConnect">Googleアカウントに接続</button>'}</div>`);
  document.getElementById('gmailSetCancel').onclick=hideSheet;document.getElementById('gmailAutoSwitch').onclick=e=>e.currentTarget.classList.toggle('on');document.getElementById('gmailSetSave').onclick=()=>{data.gmailSettings.clientId=document.getElementById('gmailClientId').value.trim();data.gmailSettings.query=document.getElementById('gmailQuery').value.trim()||DEFAULT_DATA.gmailSettings.query;data.gmailSettings.syncMinutes=Math.min(60,Math.max(1,Number(document.getElementById('gmailMinutes').value)||5));data.gmailSettings.autoSync=document.getElementById('gmailAutoSwitch').classList.contains('on');save();hideSheet();renderAll()};const c=document.getElementById('gmailConnect');if(c)c.onclick=()=>{data.gmailSettings.clientId=document.getElementById('gmailClientId').value.trim();data.gmailSettings.query=document.getElementById('gmailQuery').value.trim()||DEFAULT_DATA.gmailSettings.query;save();hideSheet();setTimeout(connectGmail,300)};const sy=document.getElementById('gmailSyncFromSettings');if(sy)sy.onclick=()=>{hideSheet();setTimeout(()=>syncGmail(),300)};const dc=document.getElementById('gmailDisconnect');if(dc)dc.onclick=()=>{hideSheet();setTimeout(disconnectGmail,300)}}

// Preserve the original UI and add Gmail sections without replacing the existing app.
const _baseRenderToday=renderToday;renderToday=function(){_baseRenderToday();const hero=document.querySelector('#todayContent .today-hero');if(hero)hero.insertAdjacentHTML('afterend',gmailTodayCardHtml());bindGmailTodayUI()};
const _baseRenderOutgoing=renderOutgoing;renderOutgoing=function(){_baseRenderOutgoing();const c=document.getElementById('outgoingContent');if(c)c.insertAdjacentHTML('beforeend',mailMonthSummaryHtml());bindOutgoingGmailUI()};
const _baseRenderSettings=renderSettings;renderSettings=function(){_baseRenderSettings();const c=document.getElementById('settingsContent');if(!c)return;const anchor=c.querySelector('.section-head');c.insertAdjacentHTML('afterbegin',`<div class="section-head"><div class="section-title">メール自動取込</div></div><div class="setting-list"><div class="setting-row" id="gmailSettingsRow"><span>Gmail自動取得</span><span class="value"><span class="gmail-state-dot ${gmailConnected()?'on':data.gmailSettings.clientId?'warn':''}"></span>${gmailConnected()?'接続中':data.gmailSettings.clientId?'未接続':'未設定'} ›</span></div></div><div class="info-card"><strong>GitHub Pages版</strong><br>Gmail APIでクレジット・デビット・口座引落の利用通知を読み取り、金額・利用先・カテゴリーを自動登録します。利用日はメール本文の「利用日・利用日時・取引日」を優先し、見つからない場合だけメール受信日を使います。判定できないメールだけ確認を求めます。カード利用額とカード請求の口座引落は二重計上しません。<br><br>アプリを閉じた状態の常時監視はGitHub Pages単体ではできません。</div>`);document.getElementById('gmailSettingsRow').onclick=openGmailSettingsSheet};

// Reset / migration safety for the new fields.
const _baseResetAll=resetAll;resetAll=function(){_baseResetAll();ensureGmailData()};


function onResume(){const r=processAutomaticTransactions();if(r.count)renderAll();maybeAutoSyncGmail(false)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')onResume()});window.addEventListener('focus',onResume);setInterval(()=>{if(document.visibilityState==='visible')onResume()},60000);
processAutomaticTransactions();rebuildGmailCardAggregates();save();renderAll();setTimeout(()=>maybeAutoSyncGmail(true),1800);

</script>

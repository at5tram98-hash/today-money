name: One-time MyMoney wallet icon replacement
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wallet-icon-once.yml
permissions:
  contents: write
jobs:
  replace-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Resize the chosen wallet illustration for PWA and iOS
        env:
          WALLET_ICON_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F084710c5-fb14-4ac2-8d29-71de00ce0836/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGdT3j1rC02dYfwgGY8t0XiI23WIVfpq7jt3pZ6xRlcj&exp=1794314885&osig=AAAAAAAAAAAAAAAAAAAAANedfPGKqFo1Eclug5rvQ6VypZfZ9yLfw-oZVhnf2dDj&signer=media-rpc&token=AAIAAU0AJDA4NDcxMGM1LWZiMTQtNGFjMi04ZDI5LTcxZGUwMGNlMDgzNgAAAAABocWAV4jxE15pejTUBGIfH59kD6uk5AMMv1qhM4gf7cG5MKcMig&x-canva-quality=thumbnail"
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import io, os, urllib.request
          from PIL import Image
          url = os.environ["WALLET_ICON_URL"]
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              im = Image.open(io.BytesIO(resp.read())).convert("RGB")
          assert im.width == im.height and im.width >= 192, f"Invalid icon source size {im.size}"
          for size in (192, 512):
              im.resize((size,size), Image.Resampling.LANCZOS).save(
                  f"icons/app-{size}.png", format="PNG", optimize=True)
          os.remove(".github/workflows/wallet-icon-once.yml")
          PY
      - name: Commit icon assets and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/app-192.png icons/app-512.png .github/workflows/wallet-icon-once.yml
          git diff --cached --check
          git commit -m 'Replace MyMoney PWA icons with selected wallet artwork'
          git pull --rebase origin main
          git push origin HEAD:main

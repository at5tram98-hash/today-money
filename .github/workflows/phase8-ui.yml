name: Phase 8 UI regression
on:
  pull_request:
    paths:
      - 'src/css/**'
      - 'tests/**'
      - '.github/workflows/phase8-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install browser binary (Ubuntu runner already has system dependencies)
        run: npx playwright install chromium
      - name: Install Japanese font for reliable visual screenshots
        timeout-minutes: 5
        run: |
          if ! fc-list :lang=ja | grep -q .; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          fc-cache -f
          fc-list :lang=ja | grep -m 1 .
      - name: Native-sheet and button smoke tests
        run: MM3_NATIVE_ONLY=1 node tests/browser.mjs
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase8-browser-results
          path: |
            test-results/browser.json
            test-results/phase8-screenshots/
            test-results/phase8-ui-depth/
            test-results/phase8-304-controls-audit.json
            test-results/phase8-action-evidence.json
          if-no-files-found: ignore

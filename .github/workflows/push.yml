name: Notification server
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", "package-lock.json", ".github/workflows/push.yml"]
permissions:
  contents: read
concurrency:
  group: today-money-push-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_PUSH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:worker
      - run: npm run push:deploy
      - name: Ensure public configuration stays unchanged
        run: git diff --exit-code -- push-config.json worker/wrangler.jsonc

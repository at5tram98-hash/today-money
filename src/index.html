<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="My Money">
<title>My Money 3.0</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/app-192.png">
<link rel="stylesheet" href="{{APP_CSS}}">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app">
  <section class="screen active" id="screen-today"><header class="topbar" id="todayTop"></header><div class="scroll" id="todayContent"></div></section>
  <section class="screen" id="screen-month"><header class="topbar" id="monthTop"></header><div class="scroll month-swipe" id="monthContent"></div></section>
  <section class="screen" id="screen-pay"><header class="topbar" id="payTop"></header><div class="scroll" id="payContent"></div></section>
  <section class="screen" id="screen-payments"><header class="topbar" id="paymentsTop"></header><div class="scroll" id="paymentsContent"></div></section>
  <section class="screen" id="screen-assets"><header class="topbar" id="assetsTop"></header><div class="scroll" id="assetsContent"></div></section>
  <section class="screen" id="screen-settings"><header class="topbar" id="settingsTop"></header><div class="scroll" id="settingsContent"></div></section>
  <section class="screen" id="screen-ledger"><header class="topbar" id="ledgerTop"></header><div class="scroll" id="ledgerContent"></div></section>
  <section class="screen" id="screen-insights"><header class="topbar" id="insightsTop"></header><div class="scroll" id="insightsContent"></div></section>
  <nav class="tabbar" id="tabbar" aria-label="メインナビゲーション">
    <span class="tab-selection" aria-hidden="true"></span>
    <button class="tab active" data-tab="home" data-symbol="house" id="homeTab"><span class="tab-icon"></span><span class="tab-label">ホーム</span></button>
    <button class="tab " data-tab="month" data-symbol="calendar" ><span class="tab-icon"></span><span class="tab-label">カレンダー</span></button>
    <button class="tab " data-tab="ledger" data-symbol="receipt" ><span class="tab-icon"></span><span class="tab-label">取引</span></button>
    <button class="tab " data-tab="insights" data-symbol="chart" ><span class="tab-icon"></span><span class="tab-label">分析</span></button>
    <button class="tab " data-tab="settings" data-symbol="moreCircle" ><span class="tab-icon"></span><span class="tab-label">その他</span></button>
  </nav>
</div>
<div class="dim" id="dim"></div><div class="sheet" id="sheet"></div><div id="pushLayer"></div><div class="ios-menu" id="menuLayer" role="menu"></div>
<div id="toastLayer" class="toast-layer" aria-live="polite" aria-atomic="true"></div>
<div class="alert-wrap" id="alertWrap"><div class="alert-box"><div class="alert-content"><div class="alert-title" id="alertTitle"></div><div class="alert-message" id="alertMessage"></div></div><div class="alert-actions" id="alertActions"></div></div></div>
<div id="calculator"><div class="calc-top"><button type="button" class="calc-cancel" id="calcCancel">キャンセル</button><div id="calcTitle">金額</div><span class="calc-top-spacer"></span></div><div class="calc-expression" id="calcExpression">金額を入力</div><div class="calc-display" id="calcDisplay"><span class="calc-number" id="calcNumber">0</span><span class="calc-unit">円</span></div><div class="calc-assists" aria-label="家計の入力補助"><button type="button" data-calc-tool="discount" aria-expanded="false">割引</button><button type="button" data-calc-tool="add" aria-expanded="false">割合を加算</button><button type="button" data-calc-tool="split" aria-expanded="false">割り勘</button></div><div id="calcTools" class="calc-tools-panel" hidden><h2 id="calcToolHeading"></h2><p id="calcToolBase"></p><label for="calcToolValue" id="calcToolLabel">割合（%）</label><input type="number" inputmode="numeric" id="calcToolValue" min="0" max="100" step="1"><output id="calcToolPreview" aria-live="polite"></output><p id="calcToolNote"></p><div class="calc-tool-actions"><button type="button" id="calcToolCancel">戻る</button><button type="button" id="calcToolApply">計算結果を使う</button></div></div><div class="calc-grid" id="calcGrid"></div><button type="button" class="calc-use" id="calcDone">この金額を使う</button></div>
<div id="lockScreen"><div class="lock-title">My Money 3.0</div><div class="row-sub" style="margin-top:8px">パスコードを入力</div><div class="lock-dots" id="lockDots"></div><div class="lock-pad" id="lockPad"></div></div>
<script src="{{APP_JS}}"></script>
</body>
</html>
